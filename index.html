<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="position.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Posicionamento de Elementos</title>
</head>
<body>
    <div>
        <p>Posicionamento Relativo</p>
        <div class="box red"></div>
         <div class="box blue relative"> </div>
    </div>
    <div>
        <p>Posicionamento Absoluto</p>
        <div class="box red"></div>
        <div class="box blue absolute"> </div>
    </div>
    
</body>
</html>
